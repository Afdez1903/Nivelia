<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nivelia</title>
<meta name="description" content="Diario de progreso personal con calendario, experiencia, niveles y logros.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nivelia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
</style>
<style>
/* Layout: una columna estrecha estilo app de iPhone, barra de pestañas fija abajo, hojas modales que suben desde abajo. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#111113; --label2:#5F5F66; --label3:#8E8E93;
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  --green-t:#1B8A3A; --red-t:#D70015; --xp:#FF9500; --onaccent:#FFFFFF;
  --bar-bg:rgba(249,249,251,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --label:#F5F5F7; --label2:#A1A1A8; --label3:#6E6E73;
    --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24);
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
    --green-t:#30D158; --red-t:#FF6961; --xp:#FF9F0A; --bar-bg:rgba(22,22,24,.86);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --label:#F5F5F7; --label2:#A1A1A8; --label3:#6E6E73;
  --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --green-t:#30D158; --red-t:#FF6961; --xp:#FF9F0A; --bar-bg:rgba(22,22,24,.86);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--label);font-family:var(--font);font-size:16px;line-height:1.35;
  padding-block:8px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tnum{font-variant-numeric:tabular-nums}

/* Cabecera */
.navrow{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.navrow .grp{display:flex;gap:4px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--blue)}
.icon-btn:active{background:var(--fill)}
.link{color:var(--blue);font-weight:500;padding:6px 8px;border-radius:8px}
h1{font-size:2.1rem;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:2px 0 2px;text-wrap:balance}
.sub{color:var(--label2);font-size:.95rem;margin:0}

/* Tarjeta de experiencia */
.card{background:var(--card);border-radius:16px}
.xp{padding:16px;display:flex;flex-direction:column;gap:12px}
.xp-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lvl{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.rank{color:var(--label2);font-size:.9rem}
.bar{height:12px;border-radius:6px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--xp);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xp-foot{display:flex;justify-content:space-between;gap:12px;color:var(--label2);font-size:.85rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:600;background:var(--fill)}
.chip.pos{color:var(--green-t);background:color-mix(in srgb,var(--green) 16%,transparent)}
.chip.neg{color:var(--red-t);background:color-mix(in srgb,var(--red) 14%,transparent)}
.chip.fire{color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}

/* Secciones tipo lista agrupada */
.sec{display:flex;flex-direction:column;gap:6px;min-width:0}
.sec-h{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--label2);padding:0 16px}
.sec-f{font-size:.8rem;color:var(--label2);padding:0 16px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;position:relative;width:100%}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.row .main{flex:1;min-width:0}
.row .t{overflow-wrap:anywhere}
.row .d{font-size:.85rem;color:var(--label2);overflow-wrap:anywhere}
.row .x{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.x.pos{color:var(--green-t)} .x.neg{color:var(--red-t)}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.dot.good{background:var(--green)} .dot.bad{background:var(--red)} .dot.sport{background:var(--blue)}
.empty{color:var(--label2);font-size:.95rem}
.add{color:var(--blue);font-weight:500}
.add svg{flex:none}
.del{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;color:var(--label3);flex:none}
.del:active{background:var(--fill)}
.del.danger{color:var(--red)}
.check{width:24px;height:24px;border-radius:12px;border:2px solid var(--label3);display:grid;place-items:center;flex:none;color:transparent}
.check.on{background:var(--green);border-color:var(--green);color:#fff}

/* Segmentado */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;text-align:center;padding:7px 4px;border-radius:7px;font-size:.88rem;font-weight:500;min-width:0}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.seg button small{display:block;font-size:.72rem;color:var(--label2);font-weight:500}

textarea,input[type=text],input[type=number]{
  width:100%;font:inherit;font-size:16px;color:var(--label);background:var(--card);border:0;border-radius:12px;padding:12px 16px;resize:vertical;
}
textarea{min-height:92px}
.in-fill{background:var(--fill);border-radius:10px}

/* Calendario */
.cal{padding:12px 8px 8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px}
.cal-h .m{font-size:1.15rem;font-weight:700}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{font-size:.72rem;font-weight:600;color:var(--label3);text-align:center;padding:4px 0}
.cell{aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:5px;border-radius:12px;min-width:0}
.cell .n{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:1rem;font-variant-numeric:tabular-nums}
.cell.today .n{color:var(--blue);font-weight:700}
.cell.sel .n{background:var(--blue);color:#fff;font-weight:700}
.cell.fut{color:var(--label3)}
.cell.out{visibility:hidden}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px}
.dots .g{background:var(--green)} .dots .r{background:var(--red)} .dots .b{background:var(--blue)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:6px 12px 4px;color:var(--label2);font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Logros */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.a{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.a .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--fill);color:var(--label3)}
.a.got .badge{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange)}
.a .n{font-weight:600;line-height:1.2}
.a .d{font-size:.8rem;color:var(--label2)}
.a .p{font-size:.78rem;color:var(--label2);font-variant-numeric:tabular-nums}
.a:not(.got) .n{color:var(--label2)}
.a .bar{height:6px}
.a.got .bar>i{background:var(--green)}

/* Gráficas */
.chart{padding:14px 12px 8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);font-size:10px;fill:var(--label2);font-variant-numeric:tabular-nums}
.chart text.v{fill:var(--label);font-weight:600}
.chart text.today{fill:var(--blue);font-weight:700}
.chart .pos{fill:var(--green)} .chart .neg{fill:var(--red)}
.chart .zero{stroke:var(--sep);stroke-width:1}
.split{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.split .bar{height:8px}
.split .bar.neg>i{background:var(--red)}
.split .bar.pos>i{background:var(--green)}

.note{color:var(--label2);font-size:.85rem;padding:0 16px}
.btn{display:block;width:100%;text-align:center;background:var(--card);color:var(--blue);font-weight:600;padding:14px;border-radius:12px}
.btn:active{background:var(--fill)}

/* Barra de pestañas */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;color:var(--label3);font-size:.68rem;font-weight:500;text-align:center}
.tabs button[aria-current="page"]{color:var(--blue)}

/* Hoja modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px;animation:up .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:14px 0 8px;z-index:2}
.sheet-h b{font-size:1.02rem}
.sheet-h button{padding:6px 4px;font-weight:500;color:var(--blue)}
.sheet-h button.go{font-weight:700}
.sheet-h button:disabled{color:var(--label3);cursor:default}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:.8rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label2);padding:0 4px}
.preview{font-weight:700;font-variant-numeric:tabular-nums}
.sports{display:flex;flex-wrap:wrap;gap:8px}
.sports button{padding:8px 14px;border-radius:999px;background:var(--card);font-weight:500}
.sports button.on{background:var(--blue);color:#fff;font-weight:600}
.minrow{display:flex;gap:8px;align-items:center}
.minrow input{max-width:120px}

/* Aviso */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:50;
  bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background:var(--label);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;
  display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);
}
.toast button{color:var(--blue);font-weight:700;filter:brightness(1.25)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar>i{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabs" id="tabs">
    <button data-a="tab" data-v="day"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 9h6M9 13h6"/></svg>Día</button>
    <button data-a="tab" data-v="cal"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendario</button>
    <button data-a="tab" data-v="prog"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Progreso</button>
    <button data-a="tab" data-v="ach"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M9 13.5 7.5 21 12 18.5 16.5 21 15 13.5"/></svg>Logros</button>
  </div>
</nav>
<div id="layer"></div>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------- utilidades ---------- */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var pad=function(n){return String(n).padStart(2,"0")};
var dkey=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var parse=function(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var uid8=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var fmtLong=function(k){return cap(parse(k).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"}))};
var sign=function(n){return n>0?"+"+n:n<0?"−"+Math.abs(n):"0"};

/* ---------- reglas de experiencia ---------- */
var HABIT_XP=8, NOTE_XP=10;
var GOOD={s:10,m:25,l:50}, BAD={s:5,m:15,l:30};
var INT={s:.6,n:1,h:1.4};
var INT_LABEL={s:"Suave",n:"Normal",h:"Intenso"};
var SPORTS=["Fútbol","Gimnasio","Correr","Caminar","Ciclismo","Natación","Pádel","Yoga","Otro"];
var MOODS=["Mal","Regular","Normal","Bien","Genial"];
var TITLES=["Novato","Aprendiz","Constante","Disciplinado","Imparable","Maestro","Leyenda","Mítico"];
var DEFAULT_HABITS=[{id:"h1",name:"Dormir bien"},{id:"h2",name:"Beber agua"},{id:"h3",name:"Leer un rato"},{id:"h4",name:"Respirar o meditar"}];

function itemXP(it){
  if(it.t==="good") return GOOD[it.size]||0;
  if(it.t==="bad"){var b=BAD[it.size]||0;return -(it.lesson&&it.lesson.trim()?Math.round(b/2):b)}
  if(it.t==="sport") return Math.max(15,Math.round((it.min||0)*(INT[it.int]||1)));
  return 0;
}
function need(L){return 100+30*(L-1)}
function levelInfo(total){var L=1,rem=total;while(rem>=need(L)){rem-=need(L);L++}return {L:L,rem:rem,need:need(L),title:TITLES[Math.min(Math.floor((L-1)/2),TITLES.length-1)]}}
function habitCount(d){if(!d)return 0;var n=0;S.habits.forEach(function(h){if(d.habits&&d.habits[h.id])n++});return n}
function dayXP(d){
  if(!d)return 0;var x=0;(d.items||[]).forEach(function(it){x+=itemXP(it)});
  x+=habitCount(d)*HABIT_XP; if(d.note&&d.note.trim())x+=NOTE_XP; return x;
}
function isActive(d){return !!d&&((d.items&&d.items.length)||habitCount(d)>0||(d.note&&d.note.trim()))}
function isEmptyDay(d){return !d||(!(d.items&&d.items.length)&&!d.mood&&!Object.keys(d.habits||{}).length&&!(d.note&&d.note.trim()))}
function sportName(it){return it.sport==="Otro"?(it.other&&it.other.trim()||"Otro"):it.sport}

/* ---------- estado ---------- */
var today=dkey(new Date());
var S={days:{},habits:DEFAULT_HABITS.slice(),tab:"day",sel:today,cal:null,mode:"pending",loading:false,slow:false,editHabits:false,failed:false};
var d0=new Date();S.cal={y:d0.getFullYear(),m:d0.getMonth()};
var F=null;            // formulario de la hoja
var undo=null;         // ultimo elemento borrado
var col=null, dl=null, uid=null;
var CACHE="progreso-diario-v1";

function ensureDay(k){if(!S.days[k])S.days[k]={items:[],mood:null,habits:{},note:""};return S.days[k]}

/* ---------- guardado ---------- */
function saveCache(){try{localStorage.setItem(CACHE,JSON.stringify({uid:uid,days:S.days,habits:S.habits}))}catch(e){}}
function loadCache(){
  try{var j=JSON.parse(localStorage.getItem(CACHE)||"null");
    if(j&&j.days){S.days=j.days;if(j.habits&&j.habits.length)S.habits=j.habits;return j.uid||null}}catch(e){}
  return null;
}
var queues={};
function enqueue(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).then(function(){if(S.failed){S.failed=false;render()}},function(){S.failed=true;render()})}
function persistDay(k){
  saveCache(); if(!col)return;
  enqueue("d"+k,function(){
    var ref=col.doc("d-"+k), d=S.days[k];
    if(isEmptyDay(d)){return ref.delete()}
    return ref.set({date:k,items:d.items||[],mood:d.mood==null?null:d.mood,habits:d.habits||{},note:d.note||""});
  });
}
function persistHabits(){saveCache();if(!col)return;enqueue("settings",function(){return col.doc("settings").set({habits:S.habits})})}

function subscribe(){
  var migrated=false;
  S.loading=true;
  setTimeout(function(){if(S.loading){S.slow=true;render()}},10000);
  col.orderBy("date","desc").limit(1000).onSnapshot(function(snap){
    if(snap.metadata.fromCache&&snap.empty)return;
    var days={};
    snap.docs.forEach(function(doc){
      if(doc.id==="settings")return;var v=doc.data();if(!v||!v.date)return;
      days[v.date]={items:v.items||[],mood:v.mood==null?null:v.mood,habits:v.habits||{},note:v.note||""};
    });
    if(!snap.metadata.fromCache){
      if(!migrated&&!Object.keys(days).length&&Object.keys(S.days).length){
        migrated=true;Object.keys(S.days).forEach(persistDay);persistHabits();
        S.loading=false;S.slow=false;render();return;
      }
      migrated=true;S.loading=false;S.slow=false;
    }
    S.days=days;saveCache();render();
  },function(){S.loading=false;S.failed=true;render()});
  col.doc("settings").onSnapshot(function(snap){
    if(snap.exists){var v=snap.data();if(v&&v.habits&&v.habits.length){S.habits=v.habits;saveCache();render()}}
  },function(){});
}

/* ---------- estadisticas ---------- */
function totalXP(){var t=0;Object.keys(S.days).forEach(function(k){t+=dayXP(S.days[k])});return Math.max(0,t)}
function streaks(){
  var keys=Object.keys(S.days).filter(function(k){return isActive(S.days[k])}).sort();
  var best=0,run=0,prev=null;
  keys.forEach(function(k){
    if(prev){var n=parse(prev);n.setDate(n.getDate()+1);run=dkey(n)===k?run+1:1}else run=1;
    if(run>best)best=run;prev=k;
  });
  var cur=0,c=parse(today);
  if(!isActive(S.days[dkey(c)]))c.setDate(c.getDate()-1);
  while(isActive(S.days[dkey(c)])){cur++;c.setDate(c.getDate()-1)}
  return {cur:cur,best:best};
}
function stats(){
  var s={entries:0,good:0,bad:0,sport:0,lessons:0,minutes:0,habitsDone:0,notes:0,round:0,cat:{good:0,sport:0,habit:0,note:0,bad:0},sports:{}};
  var kinds={};
  Object.keys(S.days).forEach(function(k){
    var d=S.days[k],g=0,sp=0;
    (d.items||[]).forEach(function(it){
      var x=itemXP(it);s.entries++;
      if(it.t==="good"){s.good++;g++;s.cat.good+=x}
      else if(it.t==="bad"){s.bad++;if(it.lesson&&it.lesson.trim())s.lessons++;s.cat.bad+=x}
      else{s.sport++;sp++;s.minutes+=it.min||0;s.cat.sport+=x;var n=sportName(it);kinds[n]=1;var o=s.sports[n]||(s.sports[n]={n:0,min:0});o.n++;o.min+=it.min||0}
    });
    var h=habitCount(d);s.habitsDone+=h;s.cat.habit+=h*HABIT_XP;
    if(d.note&&d.note.trim()){s.notes++;s.cat.note+=NOTE_XP}
    if(g>=2&&sp>=1)s.round++;
  });
  s.kinds=Object.keys(kinds).length;
  var st=streaks();s.streak=st.cur;s.best=st.best;
  s.total=totalXP();s.level=levelInfo(s.total).L;
  s.entries+=s.habitsDone+s.notes;
  return s;
}

function dayCounts(d){var c={g:0,r:0,b:0};if(d)(d.items||[]).forEach(function(i){if(i.t==="good")c.g++;else if(i.t==="bad")c.r++;else c.b++});return c}

function chart7(){
  var arr=[];
  for(var i=6;i>=0;i--){var d=parse(today);d.setDate(d.getDate()-i);var k=dkey(d);arr.push({k:k,x:dayXP(S.days[k]),l:"LMXJVSD".charAt((d.getDay()+6)%7)})}
  var W=320,H=160,top=22,bot=32,ph=H-top-bot;
  var pos=Math.max.apply(null,arr.map(function(a){return Math.max(0,a.x)})),neg=Math.max.apply(null,arr.map(function(a){return Math.max(0,-a.x)}));
  var range=(pos+neg)||1,zero=top+ph*pos/range,slot=W/7,bw=26,out="";
  out+='<line class="zero" x1="0" x2="'+W+'" y1="'+zero+'" y2="'+zero+'"/>';
  arr.forEach(function(a,i){
    var cx=slot*i+slot/2,h=a.x===0?0:Math.max(2,Math.abs(a.x)/range*ph);
    if(a.x!==0){
      var y=a.x>0?zero-h:zero;
      out+='<rect class="'+(a.x>0?"pos":"neg")+'" x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+(a.x>0?"var(--green)":"var(--red)")+'"/>';
      out+='<text class="v" text-anchor="middle" x="'+cx+'" y="'+(a.x>0?zero-h-5:zero+h+12)+'">'+a.x+'</text>';
    }
    out+='<text class="'+(a.k===today?"today":"")+'" text-anchor="middle" x="'+cx+'" y="'+(H-8)+'">'+a.l+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="XP de los últimos 7 días">'+out+'</svg>';
}

    var lab=F.type==="good"?[["s","Pequeño","+10"],["m","Medio","+25"],["l","Grande","+50"]]:[["s","Leve","−5"],["m","Medio","−15"],["l","Fuerte","−30"]];
    body+='<div class="field"><div class="lab">Tamaño</div>'+seg("fsize",lab,F.size)+'</div>';
    if(F.type==="bad")body+='<div class="field"><label for="f-lesson">¿Qué aprendes? (reduce la penalización a la mitad)</label><input id="f-lesson" type="text" maxlength="160" placeholder="La próxima vez respiro antes de contestar" value="'+esc(F.lesson)+'"></div>';
  }
  body+='<div class="field"><div class="lab">XP de esta entrada</div><div class="preview" id="f-prev"></div></div>';
  return '<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Nueva entrada"><div class="sheet-h"><button data-a="closeSheet">Cancelar</button><b>'+titles[F.type]+'</b><button class="go" id="f-go" data-a="saveSheet">Guardar</button></div>'+body+'</div></div>';
}
function updatePreview(){
  var x=formXP(),p=$("#f-prev"),g=$("#f-go");
  if(p){p.textContent=sign(x)+" XP";p.style.color=x>=0?"var(--green-t)":"var(--red-t)"}
  if(g)g.disabled=!formValid();
}
function openSheet(type){
  F={type:type,text:"",size:"m",lesson:"",sport:"Fútbol",other:"",min:45,int:"n"};
  drawSheet();
}
function drawSheet(){
  $("#layer").innerHTML=sheetHTML();updatePreview();
  var f=$("#f-text")||$("#f-min");if(f&&F.type!=="sport"&&!F.text)f.focus();
}
function closeSheet(){F=null;$("#layer").innerHTML=""}

/* ---------- avisos ---------- */
var toastTimer=null;
function toast(msg,undoable){
  var t=$("#toast");t.className="toast";t.hidden=false;
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undoable?'<button data-a="undo">Deshacer</button>':'');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},undoable?5000:2800);
}
function withXP(fn){
  var b=totalXP(),bl=levelInfo(b).L;
  fn();
  var a=totalXP(),al=levelInfo(a),diff=dayXP.length?0:0;
  render();
  return {before:b,after:a,up:al.L>bl,info:al};
}
function announce(r,delta){
  if(r.up)toast("Nivel "+r.info.L+" · "+r.info.title);
  else if(delta)toast(sign(delta)+" XP");
}

/* ---------- acciones ---------- */
var noteTimer=null;
function act(a,v){
  var k=S.sel;
  switch(a){
    case"tab":S.tab=v;S.editHabits=false;render();window.scrollTo(0,0);break;
    case"prevDay":case"nextDay":{var d=parse(S.sel);d.setDate(d.getDate()+(a==="prevDay"?-1:1));S.sel=dkey(d);render();break}
    case"today":today=dkey(new Date());S.sel=today;render();break;
    case"mood":{var day=ensureDay(k);day.mood=day.mood===+v?null:+v;persistDay(k);render();break}
    case"add":if(k<=today)openSheet(v);break;
    case"del":{
      var dd=ensureDay(k),i=dd.items.findIndex(function(x){return x.id===v});
      if(i>-1){var it=dd.items[i];undo={k:k,it:it,i:i};dd.items.splice(i,1);persistDay(k);render();toast("Entrada eliminada",true)}
      break}
    case"undo":if(undo){var u=ensureDay(undo.k);u.items.splice(Math.min(undo.i,u.items.length),0,undo.it);persistDay(undo.k);undo=null;$("#toast").hidden=true;render()}break;
    case"habit":{
      var dh=ensureDay(k),was=!!dh.habits[v],r=withXP(function(){if(was)delete dh.habits[v];else dh.habits[v]=true;});
      persistDay(k);if(!was)announce(r,HABIT_XP);break}
    case"editHabits":S.editHabits=!S.editHabits;render();break;
    case"delHabit":S.habits=S.habits.filter(function(h){return h.id!==v});persistHabits();render();break;
    case"pick":S.sel=v;render();break;
    case"openDay":S.tab="day";render();window.scrollTo(0,0);break;
    case"calPrev":S.cal.m--;if(S.cal.m<0){S.cal.m=11;S.cal.y--}render();break;
    case"calNext":S.cal.m++;if(S.cal.m>11){S.cal.m=0;S.cal.y++}render();break;
    case"calToday":{var n=new Date();today=dkey(n);S.cal={y:n.getFullYear(),m:n.getMonth()};S.sel=today;render();break}
    case"ftype":F.type=v;drawSheet();break;
    case"fsize":F.size=v;drawSheet();break;
    case"fsport":F.sport=v;drawSheet();if(v==="Otro"){var o=$("#f-other");if(o)o.focus()}break;
    case"fint":F.int=v;drawSheet();break;
    case"closeSheet":closeSheet();break;
    case"saveSheet":saveSheet();break;
    case"export":doExport();break;
    case"import":{var fi=$("#importFile");if(fi)fi.click();break}
  }
}
function saveSheet(){
  if(!formValid())return;
  var k=S.sel,it={id:uid8(),t:F.type,ts:Date.now()};
  if(F.type==="sport"){it.sport=F.sport;it.other=F.sport==="Otro"?F.other.trim():"";it.min=Math.round(F.min);it.int=F.int;it.text=F.text.trim()}
  else{it.text=F.text.trim();it.size=F.size;if(F.type==="bad")it.lesson=F.lesson.trim()}
  var x=itemXP(it);
  var r=withXP(function(){ensureDay(k).items.push(it)});
  persistDay(k);closeSheet();announce(r,x);
}
function doExport(){
  try{
    var blob=new Blob([JSON.stringify({app:"nivelia",exportado:today,habitos:S.habits,dias:S.days},null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="nivelia-"+today+".json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);toast("Copia exportada");
  }catch(e){toast("No se pudo exportar")}
}
function doImport(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);if(!j||typeof j.dias!=="object")throw 0;
      Object.keys(j.dias).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)){var d=j.dias[k];S.days[k]={items:d.items||[],mood:d.mood==null?null:d.mood,habits:d.habits||{},note:d.note||""}}});
      if(j.habitos&&j.habitos.length)S.habits=j.habitos;
      saveCache();render();toast("Copia importada");
    }catch(e){toast("Ese archivo no es una copia válida")}
  };
  r.readAsText(file);
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;
  if(t.getAttribute("data-a")==="scrim"){if(e.target!==t)return;closeSheet();return}
  if(t.disabled)return;
  act(t.getAttribute("data-a"),t.getAttribute("data-v"));
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(F){
    if(t.id==="f-text")F.text=t.value;
    else if(t.id==="f-lesson")F.lesson=t.value;
    else if(t.id==="f-other")F.other=t.value;
    else if(t.id==="f-min")F.min=parseInt(t.value,10)||0;
    else return;
    updatePreview();return;
  }
  if(t.id==="note"){
    var k=S.sel,d=ensureDay(k);d.note=t.value;
    clearTimeout(noteTimer);noteTimer=setTimeout(function(){persistDay(k)},700);
  }
});
document.addEventListener("focusout",function(e){
  if(e.target.id==="note"){var k=S.sel;clearTimeout(noteTimer);persistDay(k);setTimeout(function(){if(document.activeElement.id!=="note")render()},0)}
});
document.addEventListener("submit",function(e){
  var f=e.target.closest("[data-form='habit']");if(!f)return;e.preventDefault();
  var i=$("#newHabit"),name=i.value.trim();if(!name)return;
  S.habits.push({id:"h"+uid8(),name:name});persistHabits();render();var n=$("#newHabit");if(n)n.focus();
});
document.addEventListener("change",function(e){if(e.target.id==="importFile"&&e.target.files[0]){doImport(e.target.files[0]);e.target.value=""}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&F)closeSheet()});
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){var t=dkey(new Date());if(t!==today){var wasToday=S.sel===today;today=t;if(wasToday)S.sel=t;render()}}
});

/* ---------- arranque ---------- */
async function init(){
  var cacheUid=loadCache();
  render();
  var u=null,d=null;
  try{
    if(window.claude&&window.claude.use){
      u=await window.claude.use("user");
      d=await window.claude.use("db");
      dl=await window.claude.use("downloads");
    }
  }catch(e){}
  try{uid=u?await u.id():null}catch(e){uid=null}
  if(d&&uid){
    if(cacheUid&&cacheUid!==uid){S.days={};S.habits=DEFAULT_HABITS.slice()}
    col=d.collection("data/users/"+uid);S.mode="db";subscribe();
  }else{
    S.mode="local";uid=null;
  }
  render();
}
init();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
